# Deploys viz/ to GitHub Pages. MANUAL TRIGGER ONLY (workflow_dispatch) and inert until the repository
# owner enables Pages (Settings > Pages > Source: GitHub Actions). Nothing here enables Pages or changes
# repository visibility.
name: Deploy visualizer to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the page before publishing
        run: node viz/test/viz_test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz
      - id: deployment
        uses: actions/deploy-pages@v4
