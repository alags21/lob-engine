name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgtest-dev libbenchmark-dev clang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLOB_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark smoke run (checks it builds and runs; timings are not used)
        if: matrix.build_type == 'Release'
        run: |
          build/bench/lob_bench --workload passive --ops 20000 --reps 1 --out /tmp/smoke_passive.json
          build/bench/lob_bench --workload aggressive --ops 20000 --reps 1 --out /tmp/smoke_aggressive.json
      - name: Multi-threaded pipeline smoke run (checksum gate vs single thread; timings are not used)
        if: matrix.build_type == 'Release'
        timeout-minutes: 10
        run: |
          for q in single-thread mutex-book mutex-cv-queue spsc spsc-yield spsc-backoff spsc-unpadded; do
            build/bench/lob_mt_bench --queue $q --workload balanced --ops 30000 --reps 1 --rate 200000 --out /tmp/mt_$q.json
          done
      - name: Differential fuzz (Release, 1.5M ops, seeds printed)
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p fuzz-out
          build/tests/lob_fuzz --seed 1 --ops 500000 --runs 2 --record fuzz-out
          build/tests/lob_fuzz --seed $((100000 + GITHUB_RUN_NUMBER)) --ops 500000 --record fuzz-out
      - name: Differential fuzz (Debug, invariants checked after every op)
        if: matrix.build_type == 'Debug'
        run: |
          mkdir -p fuzz-out
          build/tests/lob_fuzz --seed 1 --ops 100000 --check-every 1 --record fuzz-out
      - name: Upload failing op logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-fail-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: fuzz-out/
          if-no-files-found: ignore

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgtest-dev libbenchmark-dev clang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOB_SANITIZE=ON -DLOB_WERROR=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Differential fuzz under ASan+UBSan
        run: |
          mkdir -p fuzz-out
          build/tests/lob_fuzz --seed 1 --ops 200000 --check-every 1 --record fuzz-out
      - name: Upload failing op logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-fail-sanitizers
          path: fuzz-out/
          if-no-files-found: ignore

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgtest-dev libbenchmark-dev clang
      - name: Work around TSan and high ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOB_TSAN=ON -DLOB_WERROR=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Queue, stress and pipeline tests under TSan
        run: build/tests/lob_tests --gtest_filter='SpscQueue.*:SpscStress.*:MutexQueueStress.*:Pipeline.*'
      - name: Multi-threaded benchmark under TSan (small, checksum gate)
        run: |
          for q in mutex-book mutex-cv-queue spsc spsc-unpadded; do
            build/bench/lob_mt_bench --queue $q --workload balanced --ops 20000 --reps 1 --rate 100000 --out /tmp/tsan_$q.json
          done
      - name: Negative control, TSan must flag a deliberately racy queue
        run: |
          cmake -S . -B build-racy -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOB_TSAN=ON -DLOB_RACY_DEMO=ON -DLOB_BUILD_BENCH=OFF -DLOB_BUILD_TOOLS=OFF -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-racy --target lob_racy_demo
          if build-racy/tests/lob_racy_demo > racy.log 2>&1; then
            echo "TSan did NOT report the deliberate race"; cat racy.log; exit 1
          fi
          grep -q "ThreadSanitizer: data race" racy.log
          echo "TSan reported the deliberate race as expected:"; grep -m3 "ThreadSanitizer" racy.log

  viz:
    name: Visualizer and generated data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgtest-dev libbenchmark-dev
      - name: Build lob_sim and lob_replay
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOB_BUILD_TESTS=OFF -DLOB_BUILD_BENCH=OFF
          cmake --build build --target lob_sim lob_replay
      - name: Sample run regenerates byte-identically on Linux (cross-platform determinism)
        run: python3 scripts/make_viz_data.py --sim "$PWD/build/tools/lob_sim" --check
      - name: Generated reports are up to date
        run: |
          python3 scripts/make_report.py --check
          python3 scripts/make_mt_report.py --check
          python3 scripts/make_realdata_report.py --check
      - name: Replay round trip (CSV and JSON lines give the same checksum as the generator)
        run: |
          build/tools/lob_sim --seed 3 --ops 3000 --csv /tmp/r.csv --jsonl /tmp/r.jsonl --json /tmp/r_sim.json | tee /tmp/sim.txt
          build/tools/lob_replay --json /tmp/r_csv.json /tmp/r.csv | tee /tmp/csv.txt
          build/tools/lob_replay --json /tmp/r_jsonl.json /tmp/r.jsonl | tee /tmp/jsonl.txt
          sim=$(grep -o 'checksum=[0-9a-f]*' /tmp/sim.txt)
          grep -q "$sim" /tmp/csv.txt
          grep -q "$sim" /tmp/jsonl.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Visualizer tests (mock canvas, fake DOM, static checks)
        run: node viz/test/viz_test.js

  itch-synthetic:
    name: ITCH pipeline (synthetic data only) and repository data guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgtest-dev libbenchmark-dev zlib1g-dev
      - name: Repository data/size guard (no raw market data, no large files)
        run: python3 scripts/check_repo_size.py
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOB_BUILD_BENCH=OFF -DLOB_WERROR=ON
          cmake --build build --target lob_itch lob_itch_tests
      - name: ITCH unit tests
        run: build/itch/lob_itch_tests
      - name: Synthetic ITCH file through scan, validate (with reference model) and replay benchmark
        run: |
          build/itch/lob_itch synth --out /tmp/synth.itch --ops 20000 --symbols 3 --seed 5
          gzip -f /tmp/synth.itch
          build/itch/lob_itch scan --input /tmp/synth.itch.gz --json /tmp/scan.json
          build/itch/lob_itch validate --input /tmp/synth.itch.gz --json /tmp/val.json --reference SYNA,SYNB,SYNC --compare-every 100
          python3 scripts/check_itch_synthetic.py /tmp/val.json
          build/itch/lob_itch bench --input /tmp/synth.itch.gz --symbols SYNA,SYNB,SYNC --reps 1 --json /tmp/bench.json
